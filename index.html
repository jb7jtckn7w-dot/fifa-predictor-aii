
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA PREDICT AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial;padding:20px}
header{text-align:center;padding:25px}
h1{color:#36d399}
.card{background:#171f32;padding:20px;border-radius:16px;margin:15px 0}
input{width:100%;padding:14px;margin:8px 0;background:#0b1020;color:white;border:1px solid #46516b;border-radius:9px}
button{width:100%;padding:15px;background:#16a36a;color:white;border:0;border-radius:10px;font-weight:bold;margin-top:12px}
.result{text-align:center;font-size:25px;color:#36d399;padding:15px}
small{color:#aab4c8}
</style>
</head>
<body>
<header>
<h1>⚽ FIFA PREDICT AI</h1>
<p>Analyse statistique des matchs virtuels</p>
</header>

<div class="card">
<h2>📊 Nouvelle analyse</h2>
<label>Équipe 1</label>
<input id="team1" placeholder="Ex: Real Madrid">
<label>Équipe 2</label>
<input id="team2" placeholder="Ex: Barcelona">

<h3>Moyenne de buts historiques</h3>
<label>Équipe 1</label>
<input id="avg1" type="number" min="0" max="10" step="0.1" placeholder="Ex: 2.1">
<label>Équipe 2</label>
<input id="avg2" type="number" min="0" max="10" step="0.1" placeholder="Ex: 1.6">

<button onclick="analyse()">LANCER L'ANALYSE</button>
</div>

<div class="card" id="output">
<h2>Résultats</h2>
<p>Entre les statistiques pour commencer.</p>
</div>

<script>
function analyse(){
const a=document.getElementById("team1").value.trim();
const b=document.getElementById("team2").value.trim();
const x=Number(document.getElementById("avg1").value);
const y=Number(document.getElementById("avg2").value);

if(!a||!b||document.getElementById("avg1").value===""||
document.getElementById("avg2").value===""||
x<0||y<0||x>10||y>10){
alert("Remplis correctement tous les champs.");
return;
}

const score1=Math.round(x);
const score2=Math.round(y);
const total=x+y;
const over=total>2.5?"Plus de 2,5 buts":"Moins de 2,5 buts";

document.getElementById("output").innerHTML=`
<h2>📈 Résultat de l'analyse</h2>
<p>${a} VS ${b}</p>
<div class="result">${score1} - ${score2}</div>
<p>Moyenne de buts : ${total.toFixed(2)}</p>
<p>Tendance statistique : ${over}</p>
<small>Estimation indicative basée uniquement sur les moyennes saisies. Ce n'est pas une prédiction fiable du résultat réel.</small>`;
}
</script>
</body>
</html>
